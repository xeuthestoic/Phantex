<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Phantex — Outil OSINT éducatif propulsé par IA. Apprenez les techniques de recherche en sources ouvertes." />
  <title>Phantex — OSINT Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%237020cc'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>Φ</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">Φ</div>
      <div>
        PHANTEX
        <div class="logo-sub">OSINT INTELLIGENCE PLATFORM</div>
      </div>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      SYSTÈME OPÉRATIONNEL
    </div>
  </header>

  <div class="layout">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-label">Navigation</div>
      <div class="nav-item active" id="nav-search"    onclick="showView('search')">
        <span class="nav-icon">⌕</span> Recherche
      </div>
      <div class="nav-item" id="nav-history"   onclick="showView('history')">
        <span class="nav-icon">◷</span> Historique
        <span class="badge" id="hist-badge">0</span>
      </div>
      <div class="nav-item" id="nav-learn"     onclick="showView('learn')">
        <span class="nav-icon">◈</span> Apprendre
      </div>
      <div class="nav-item" id="nav-resources" onclick="showView('resources')">
        <span class="nav-icon">◎</span> Ressources
      </div>
      <div class="sidebar-footer">
        <div class="edu-note">⚠ Outil éducatif — usage légal uniquement</div>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="main" id="main-content">
      <!-- Rendered by app.js -->
    </main>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/particles.js"></script>
</body>
</html>
